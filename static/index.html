<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat (Session Server)</title>
    <style>
        :root { --bg: #1e1f20; --surface: #282a2c; --primary: #8ab4f8; --text: #e3e3e3; --text-dim: #9aa0a6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Google Sans', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--surface); padding: 16px 24px; border-bottom: 1px solid #3c4043; }
        #chat { flex: 1; overflow-y: auto; padding: 24px; max-width: 850px; width: 100%; margin: 0 auto; }
        .message { margin-bottom: 24px; line-height: 1.6; font-size: 15px; }
        .user { text-align: right; }
        .user span { background: #2d2e30; padding: 10px 16px; border-radius: 16px 16px 4px 16px; display: inline-block; text-align: left; }
        .assistant pre { background: #131314; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; border: 1px solid #3c4043; }
        .assistant code { font-family: monospace; }
        .assistant ul, .assistant ol { margin: 10px 0 12px 24px; }
        .assistant li { margin: 6px 0; }
        .assistant h1, .assistant h2, .assistant h3 { margin: 16px 0 8px; font-size: 16px; color: #c5d4f5; font-weight: 600; }
        .assistant h1 { font-size: 19px; } .assistant h2 { font-size: 17px; }
        .assistant img { max-width: 100%; border-radius: 8px; margin: 10px 0; display: block; }
        .assistant a { color: var(--primary); }
        .assistant p { margin: 8px 0; }
        .assistant table { border-collapse: collapse; margin: 10px 0; width: 100%; }
        .assistant th, .assistant td { border: 1px solid #3c4043; padding: 6px 10px; }
        .thinking { color: var(--text-dim); font-style: italic; display: flex; align-items: center; gap: 8px; }
        .dots span { width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; display: inline-block; animation: bounce 1s infinite; }
        .dots span:nth-child(2) { animation-delay: 0.15s; }
        .dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce { 0%,80%,100% { transform: scale(0.6); opacity:0.5; } 40% { transform: scale(1); opacity:1; } }
        #input-area { background: var(--surface); border-top: 1px solid #3c4043; padding: 16px; }
        .input-wrap { max-width: 850px; margin: 0 auto; background: #1e1f20; border: 1px solid #3c4043; border-radius: 24px; padding: 8px 8px 8px 20px; display: flex; align-items: flex-end; gap: 12px; }
        #prompt { flex: 1; background: none; border: none; color: var(--text); font-size: 15px; resize: none; outline: none; max-height: 200px; padding: 10px 0; }
        #send-btn { background: var(--primary); color: #1e1f20; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        #send-btn:disabled { background: #3c4043; color: #5f6368; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h2>Gemini Chat (Session Server)</h2>
    </header>

    <div id="chat">
        <div class="message assistant">
            <p>Sistema inicializado. Conectado al servidor.</p>
        </div>
    </div>

    <div id="input-area">
        <div class="input-wrap">
            <textarea id="prompt" rows="1" placeholder="Escribe un prompt aquí"></textarea>
            <button id="send-btn" onclick="send()">➤</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}/ws/gemini`);
        const chat = document.getElementById('chat');
        const promptEl = document.getElementById('prompt');
        const sendBtn = document.getElementById('send-btn');
        let isReceiving = false;
        let currentMsg = null;
        let lastHtml = '';

        marked.setOptions({ breaks: true, gfm: true });

        let thinkingEl = null;

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'thinking') {
                if (thinkingEl) thinkingEl.remove();
                thinkingEl = document.createElement('div');
                thinkingEl.className = 'message assistant thinking';
                thinkingEl.innerHTML = '<span class="dots"><span></span><span></span><span></span></span> Gemini está pensando...';
                chat.appendChild(thinkingEl);
                chat.scrollTop = chat.scrollHeight;
            } else if (data.type === 'chunk') {
                if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
                if (!isReceiving) {
                    isReceiving = true;
                    currentMsg = document.createElement('div');
                    currentMsg.className = 'message assistant';
                    chat.appendChild(currentMsg);
                }
                // HTML limpio del backend (preserva negrillas, listas, imágenes)
                lastHtml = data.html;
                currentMsg.innerHTML = data.html;
                // Convertir <p><b>Título</b></p> (no terminados en ":") en <h3>
                currentMsg.querySelectorAll('p').forEach(p => {
                    if (p.children.length === 1 && p.firstChild === p.querySelector('b')) {
                        const b = p.querySelector('b');
                        const txt = (b.textContent || '').trim();
                        if (txt && !txt.endsWith(':')) {
                            const h = document.createElement('h3');
                            h.textContent = txt;
                            p.replaceWith(h);
                        }
                    }
                });
                chat.scrollTop = chat.scrollHeight;
            } else if (data.type === 'complete') {
                isReceiving = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = '➤';
                lastHtml = '';
            } else if (data.type === 'error') {
                if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
                isReceiving = false;
                sendBtn.disabled = false;
                if (!currentMsg) {
                    currentMsg = document.createElement('div');
                    currentMsg.className = 'message assistant';
                    chat.appendChild(currentMsg);
                }
                currentMsg.innerHTML = `<p style="color: red;">Error: ${data.message}</p>`;
            }
        };

        function send() {
            const text = promptEl.value.trim();
            if (!text || isReceiving) return;
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `<span>${text}</span>`;
            chat.appendChild(userMsg);
            ws.send(JSON.stringify({ prompt: text }));
            promptEl.value = '';
            promptEl.style.height = 'auto';
            sendBtn.disabled = true;
            currentMsg = null;
            lastHtml = '';
        }

        promptEl.addEventListener('input', () => {
            promptEl.style.height = 'auto';
            promptEl.style.height = promptEl.scrollHeight + 'px';
        });
        promptEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });
    </script>
</body>
</html>
